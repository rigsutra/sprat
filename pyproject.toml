[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sprat"
version = "0.2.0"
description = "Test any REST API from its OpenAPI/Swagger spec: lint, fuzzing, wrong-type probing, BOLA and OWASP ZAP in one run"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "rigsutra"}]
keywords = ["openapi", "swagger", "api-testing", "api-security", "fuzzing", "dast", "bola", "owasp-zap", "schemathesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = ["schemathesis>=4", "httpx", "pyyaml", "jinja2", "fastapi", "uvicorn", "cryptography"]

[project.urls]
Homepage = "https://github.com/rigsutra/sprat"
Documentation = "https://github.com/rigsutra/sprat/tree/master/docs"
Issues = "https://github.com/rigsutra/sprat/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "hypothesis"]

[project.scripts]
sprat = "sprat.cli:main"

[tool.setuptools]
packages = ["sprat", "sprat.stages", "sprat.web"]

[tool.setuptools.package-data]
"sprat.web" = ["static/*", "guides/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than a couple of seconds (deselect with -m 'not slow')",
    "e2e: drives the real examples/demo_api.py end to end",
    "external: needs a real external tool (Node, Docker); skipped when it is absent",
]
